<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* 游戏容器（居中，宽度自适应） */
        .game-container {
            width: min(90vw, 90vh);
            max-width: 1000px;
        }

        /* 分数面板 */
        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 8px 0;
            font-size: clamp(16px, 2vw, 32px);
            gap: 8px;
        }

        /* 静音按钮（TASK-003） */
        .icon-btn {
            background: transparent;
            border: none;
            font-size: clamp(20px, 3vw, 32px);
            cursor: pointer;
            padding: 4px;
        }

        #score { color: #FFD700; }
        #highScore { color: #C0C0C0; }

        /* 游戏画布（宽度跟随容器，高度自动保持比例） */
        #gameCanvas {
            display: block;
            width: 100%;
            height: auto;
            border: 2px solid #16213e;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 分数面板 -->
        <div class="score-panel">
            <span id="score">分数: 0</span>
            <span id="highScore">最高分: 0</span>
            <button id="muteBtn" class="icon-btn" aria-label="静音切换">🔊</button>
        </div>
        <!-- 游戏画布（动态尺寸，由JS计算） -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
